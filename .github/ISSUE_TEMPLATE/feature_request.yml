name: Feature request
description: Propose a scoped improvement to monzo-mcp
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Initial checks
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: This request fits a personal, self-hosted, or otherwise permitted Monzo integration.
          required: true
        - label: This request contains no credentials or real financial data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain any new data, permissions, writes, network access, or durable state.
    validations:
      required: true
