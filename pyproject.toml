[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monzo-mcp"
version = "0.1.0"
description = "An MCP server and fully async client for the Monzo Developer API"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Joshua Rowe" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=49,<50",
    "httpx>=0.28.1,<1",
    "mcp>=1.28.1,<2",
    "pydantic>=2.12,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.51,<1",
]

[project.scripts]
monzo-mcp = "monzo_mcp.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monzo_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/monzo_mcp",
    "LICENSE",
    "README.md",
]

[tool.uv]
package = true
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "S",
    "SIM",
    "TCH",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
files = ["src/monzo_mcp", "tests"]
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
